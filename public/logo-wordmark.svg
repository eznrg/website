  <title id="ezword-title">EZ NRG</title>
  <!--
    Official EZ NRG wordmark, hand-authored vector.

    The supplied artwork (Mint Green Border Letters.png) is white letters with a
    teal outline on an OPAQUE WHITE band - unusable on this site's dark surfaces,
    and the white background cannot be keyed out because the letters are white too.
    So the letterforms were recovered from the teal outline (chroma channel), which
    forms closed contours, then filled. Contour nesting depth is used to keep the
    counters of R and G open - hence fill-rule evenodd below.

    Filled in the artwork's own letter colour. The hairline teal border of the
    source is dropped on purpose: at the ~24px cap height this renders at, it would
    be a sub-pixel stroke and would only muddy the edges.
  -->

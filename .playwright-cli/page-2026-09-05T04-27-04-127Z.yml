        - paragraph [ref=e48]: Why hotels are different
        - heading "A hotel is a distinct energy system." [level=2] [ref=e49]
        - paragraph [ref=e50]: Lodging is 3% of U.S. commercial buildings but 9% of fuels consumption — and water heating and space heating alone account for almost 40% of that usage. The load behaves unlike any other commercial property.
      - generic [ref=e51]:
        - article [ref=e52]:
          - heading "Energy is a product input" [level=3] [ref=e56]
          - paragraph [ref=e57]: Your property converts energy into a continuous guest experience — conditioned rooms, hot water, laundry, food service, amenity availability. That makes energy a cost center and an input to the product at the same time.
        - article [ref=e58]:
          - heading "Occupancy alone doesn't explain it" [level=3] [ref=e62]
          - paragraph [ref=e63]: Load is driven by occupancy, weather, and service intensity together. Two nights with the same room count can produce very different energy outcomes depending on temperature, events, and laundry timing.
        - article [ref=e64]:
          - heading "The monthly bill hides the answer" [level=3] [ref=e68]
          - paragraph [ref=e69]: A bill shows how much you consumed — not when you created cost, where you had flexibility, or which subsystem drove the deviation. Interval data, weather, and occupancy context are what make those questions answerable.

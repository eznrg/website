      - generic [ref=e154]:
        - generic [ref=e155]: "01"
        - heading "Executive Summary" [level=2] [ref=e158]
        - paragraph [ref=e159]: A hotel is not an office building with beds. It is a 24/7 service factory where electricity, gas, and water are converted into sleep quality, hot showers, clean linens, food service, comfort, and brand consistency. Energy is both a cost center and a product input. The objective is not simply to use less energy; it is to use the right energy, at the right time, without affecting the guest experience. Every recurring operating-cost reduction can improve NOI and, subject to prevailing valuation assumptions, a property’s value.
        - paragraph [ref=e160]: "In ComEd/PJM, energy value is increasingly shaped by timing, flexibility, and verifiability as well as annual kWh. Machine learning is useful here only when it improves a decision with existing economic value: forecasting load, identifying peak-risk windows, estimating controllable flexibility, detecting anomalies, and preparing a property for demand response or storage. The near-term case rests on operational savings, bill validation, and procurement discipline; regulatory change is potential upside, not a prerequisite."
        - generic [ref=e161]:
          - generic [ref=e162]:
            - paragraph [ref=e166]: Measure
            - paragraph [ref=e167]: Normalize interval, weather & occupancy data
          - generic [ref=e168]:
            - paragraph [ref=e172]: Model
            - paragraph [ref=e173]: Forecast load & flag anomalies
          - generic [ref=e174]:
            - paragraph [ref=e178]: Control
            - paragraph [ref=e179]: Act within guardrails, comfort first
          - generic [ref=e180]:
            - paragraph [ref=e184]: Monetize
            - paragraph [ref=e185]: Procurement, peak & DR value
          - generic [ref=e186]:
            - paragraph [ref=e190]: Build
            - paragraph [ref=e191]: Size solar, storage & CHP last
        - heading "24/7 Buildings" [level=3] [ref=e192]
        - paragraph [ref=e193]:
          - text: Hotel energy use is materially influenced by occupancy, but not linearly determined by it. The highest-value forecasting variables are occupancy, weather, service intensity, equipment schedules, and operating constraints. As utility rates become more dynamic (Time-of-Use) and market access grows, this opens the door to a unique opportunity. DOE’s Better Buildings hospitality sector notes that hotels are among the higher energy and water consumers per square foot because they operate continuously, and EIA’s 2018 CBECS lodging data shows that lodging represented 3% of U.S. commercial buildings, 9% of fuels consumption, and 8% of fuels expenditures — while water heating and space heating alone accounted for almost 40% of energy usage.
          - link "[1]" [ref=e194] [cursor=pointer]:
            - /url: "#src-1"
          - link "[2]" [ref=e195] [cursor=pointer]:
            - /url: "#src-2"
        - heading "Forward-Looking Context" [level=3] [ref=e196]
        - paragraph [ref=e197]:
          - text: "PJM capacity-market volatility has moved from an abstract wholesale issue into a retail-procurement consideration: the 2025/2026 Base Residual Auction produced a $14.7 billion total cost to load, the 2026/2027 BRA cleared at its $329.17/MW-day UCAP cap, and the 2027/2028 BRA cleared at its temporary $333.44/MW-day UCAP cap while procuring less capacity than the RTO Reliability Requirement."
          - link "[22]" [ref=e198] [cursor=pointer]:
            - /url: "#src-22"
          - link "[23]" [ref=e199] [cursor=pointer]:
            - /url: "#src-23"
          - link "[28]" [ref=e200] [cursor=pointer]:
            - /url: "#src-28"
          - text: These results do not flow through identically to every hotel; exposure depends on contract structure, utility treatment, hedging, and rate design. They do underscore why load shape and contract terms deserve close attention.
      - generic [ref=e201]:
        - generic [ref=e202]: "02"
        - heading "Why Hotels Are a Distinct Energy System" [level=2] [ref=e205]
        - heading "A hotel is a service platform, not a generic commercial building." [level=3] [ref=e206]
        - paragraph [ref=e207]:
          - text: "Unlike many commercial properties, a hotel does not simply consume energy to keep a space open during business hours — it converts energy into a continuous guest experience: conditioned rooms, hot water, clean linens, food service, lighting, ventilation, elevators, technology access, common-area comfort, and brand-required amenity availability. Energy is therefore not just a utility expense; it is an input into the hotel’s core product. DOE and ENERGY STAR hospitality resources identify operations and controls as key energy-management themes for lodging facilities."
          - link "[1]" [ref=e208] [cursor=pointer]:
            - /url: "#src-1"
          - link "[3]" [ref=e209] [cursor=pointer]:
            - /url: "#src-3"
          - text: "Hotels also carry a mix of fixed, variable, and schedulable loads: common-area lighting, ventilation, refrigeration, IT systems, pumps, elevators, and baseline HVAC are always present, while occupancy, weather, housekeeping, food service, laundry volume, and event schedules drive the rest. A limited-service roadside hotel, a full-service urban hotel, and a resort property may all be classified as “lodging,” but their energy profiles behave very differently."
        - heading "The key variables are occupancy, weather, and service intensity." [level=3] [ref=e210]
        - paragraph [ref=e211]:
          - text: Occupancy changes guest-room HVAC, plug load, domestic hot water, elevators, laundry volume, kitchen activity, and staffing. Weather changes heating and cooling demand, humidity-control requirements, and equipment efficiency. Service intensity changes the non-room load, especially in full-service properties with kitchens, banquet space, laundry, pools, or spas — hotel energy forecasting research has explicitly used occupancy rate and temperature as model inputs, and hotel cooling-energy research confirms the influence of meteorological conditions and guest counts.
          - link "[4]" [ref=e212] [cursor=pointer]:
            - /url: "#src-4"
          - link "[5]" [ref=e213] [cursor=pointer]:
            - /url: "#src-5"
          - text: "This is why hotel load should not be treated as simply proportional to occupancy: a hotel has a meaningful baseload, and two nights with the same room count can produce different energy outcomes depending on outdoor temperature, event activity, laundry timing, guest behavior, and operating schedules."
        - heading "This load profile creates an information problem." [level=3] [ref=e214]
        - paragraph [ref=e215]:
          - text: "A monthly bill shows how much energy was consumed, but not when the hotel created cost, when it had flexibility, or which subsystem caused the deviation. The required foundation is therefore high-resolution interval data, weather, occupancy proxies, and operational context — together, they let a hotel move from reactive bill review to predictive energy management. The question changes from “how much did we spend last month?” to “which hours are likely to create avoidable costs, which systems are driving that risk, and what can we safely do about it without compromising the guest experience?” This is also why an intelligence layer becomes more valuable across a portfolio: one hotel’s interval data can identify local waste and peak-risk patterns, but many similar hotels in the same region reveal stronger ones — how comparable properties respond to weather, how occupancy translates into load, and which interventions are most effective."
          - link "[6]" [ref=e216] [cursor=pointer]:
            - /url: "#src-6"
          - link "[7]" [ref=e217] [cursor=pointer]:
            - /url: "#src-7"
          - text: Hotels are not merely buildings to be benchmarked; they are operating systems with measurable demand, controllable flexibility, and repeatable patterns.
      - generic [ref=e218]:
        - generic [ref=e219]: "03"
        - heading "Load Shape Considerations" [level=2] [ref=e222]
        - paragraph [ref=e223]: If a hotel’s energy strategy has a single foundation, it is the shape of its load — not the total kilowatt-hours it consumes, but when those kilowatts arrive. Across four metered lodging properties in the ComEd territory, that shape is strikingly consistent, and it points the same direction.
        - paragraph [ref=e224]:
          - text: Every one of the four meters set its annual peak in January, and every peak landed in a morning or evening ramp hour — 07:00 and 09:00 on one side of the day, 17:00 and 19:00 on the other
          - link "780" [ref=e225] [cursor=pointer]:
            - /url: "#prop-780"
          - link "781" [ref=e226] [cursor=pointer]:
            - /url: "#prop-781"
          - text: . None peaked on a summer afternoon. That single fact matters because PJM’s system and capacity peaks fall on hot summer afternoons
          - link "[8]" [ref=e227] [cursor=pointer]:
            - /url: "#src-8"
          - text: — the hotel’s load is inverted relative to the grid it buys from. When the grid is most stressed and capacity is most expensive, these properties run near their seasonal minimum; when they hit their own peaks, the wider grid is calm.
        - paragraph [ref=e228]:
          - text: The monthly record makes the inversion concrete. For the combined meters detailed in
          - link "Appendix A5" [ref=e229] [cursor=pointer]:
            - /url: "#appendix-a5"
          - text: ", billing-month peak demand runs 127 kW in January and 98 kW in December but collapses to 46–47 kW across June, July, and August — a winter peak more than 2.5× the summer one. Because delivery (demand) charges are set by each month’s highest kW interval, the property carries its heaviest demand-charge burden in winter, not summer."
        - generic [ref=e230]:
          - generic [ref=e231]:
            - paragraph [ref=e232]: Peak-to-Average Ratio
            - paragraph [ref=e236]: 5.1x
          - generic [ref=e237]:
            - paragraph [ref=e238]: Winter vs. Summer Peak
            - paragraph [ref=e242]: 2.5x+
          - generic [ref=e243]:
            - paragraph [ref=e244]: Jan vs. Jul Delivery Charge
            - paragraph [ref=e248]: $2,540 / $920
        - paragraph [ref=e249]:
          - text: Two consequences follow, and they run through the rest of this paper. First, the peaks are peaky — individual meters show peak-to-average ratios as high as 5× (a 101.62 kW peak against a 19.9 kW average)
          - link "780" [ref=e250] [cursor=pointer]:
            - /url: "#prop-780"
          - text: . A load that spikes far above its own baseline for a handful of ramp hours is, by definition, a load with a large controllable, schedulable slice — the raw material for demand-charge management, demand response, and storage dispatch. Second, because those spikes rarely coincide with the grid’s own peaks, the property is naturally well-positioned on the capacity and coincident-peak exposures that increasingly drive cost.
        - heading "This is what it means to call a hotel a grid asset rather than a passive ratepayer." [level=3] [ref=e251]
        - paragraph [ref=e252]: The load shape is not a liability to be minimized; it is an asset to be understood and then monetized — through procurement structured around the real profile, demand-charge reduction targeted at the winter ramp hours, and, eventually, storage sized to the specific hours that carry the cost.
      - generic [ref=e253]:
        - generic [ref=e254]: "04"
        - heading "Hotels Need an Expert-Led Energy Strategy" [level=2] [ref=e257]
        - paragraph [ref=e258]: Owners must protect service quality, manage brand standards, execute property-improvement plans, and improve bookings and RevPAR. Energy strategy should support those priorities through a clear operating process rather than add a competing management burden. The anonymized Chicago-area example below shows why a disciplined view of utilities still matters.

        - heading "Energy Cost Is an Asset-Value Lever, Not Just a Line Item" [level=3] [ref=e315]
        - paragraph [ref=e316]:
          - text: Because hotels trade as income-producing assets, these utility figures matter well beyond the income statement. Every recurring dollar removed from operating expense flows directly into Net Operating Income, and stabilized NOI capitalized at the prevailing market cap rate is a primary determinant of a hotel’s value.
          - link "[9]" [ref=e317] [cursor=pointer]:
            - /url: "#src-9"
          - link "[10]" [ref=e318] [cursor=pointer]:
            - /url: "#src-10"
          - text: "The arithmetic is direct: at an illustrative 8.0% cap rate, a $50,000 reduction in annual utility expense is not merely a $50,000 saving — it represents roughly $625,000 in incremental asset value ($50,000 ÷ 0.08). Energy strategy is not a cost-cutting exercise; it is a balance-sheet lever, and the payoff scales with the property’s valuation multiple."
      - generic [ref=e319]:
        - generic [ref=e320]: "05"
        - 'heading "Market Context: Illinois, ComEd & PJM" [level=2] [ref=e323]'
        - heading "Market Structure" [level=3] [ref=e324]
        - paragraph [ref=e325]: Founded in 1927, PJM is the regional grid operator responsible for coordinating the movement of wholesale electricity across a large multi-state region that includes northern Illinois and the ComEd service territory. PJM doesn’t own power plants, local distribution wires, or customer meters — instead, it acts as the independent system operator and market administrator that balances electricity supply and demand in real time, manages transmission-grid reliability, and runs wholesale markets for energy, capacity, and ancillary services.
        - generic [ref=e326]:
          - generic [ref=e327]:
            - paragraph [ref=e331]: Power Plant
            - paragraph [ref=e332]: Generates electricity
          - generic [ref=e333]:
            - paragraph [ref=e337]: Transmission
            - paragraph [ref=e338]: PJM balances & moves it long-distance
          - generic [ref=e339]:
            - paragraph [ref=e343]: Distribution
            - paragraph [ref=e344]: ComEd delivers it locally
          - generic [ref=e345]:
            - paragraph [ref=e349]: End User
            - paragraph [ref=e350]: The hotel meters & pays
        - paragraph [ref=e351]:
          - text: Customers usually don’t interact directly with PJM, but PJM outcomes influence the cost structure that eventually flows through to suppliers, utilities, and end-use customers.
          - link "[11]" [ref=e352] [cursor=pointer]:
            - /url: "#src-11"
          - text: Its membership includes utility companies, wholesale suppliers, large industrial users, and a growing number of DER aggregators participating on behalf of energy users who couldn’t otherwise access PJM’s markets.
          - link "[12]" [ref=e353] [cursor=pointer]:
            - /url: "#src-12"
          - text: In Illinois, ComEd remains responsible for delivering electricity safely and reliably over the local distribution system — even when a customer chooses a third-party retail supplier, ComEd continues to provide delivery service, maintain local wires and infrastructure, and respond to outages.
        - heading "Why This Matters to a Hotel’s Bill" [level=3] [ref=e354]
        - paragraph [ref=e355]: "Energy cost is shaped by more than the supplier’s cents-per-kWh rate. A hotel’s bill can reflect delivery charges, supply charges, capacity-related costs, transmission-related costs, taxes, riders, and contract-specific pass-throughs. PJM doesn’t send the hotel a monthly retail bill, but its markets help determine the underlying wholesale costs that suppliers and utilities must manage — so a hotel’s physical load shape (when it uses electricity, how high its peaks run, how flexible it can be) affects its exposure to costs that originate upstream. When the system is tight, high-demand hours become especially important: a customer that can forecast, reduce, or shift load during those windows may reduce certain cost exposures, improve procurement outcomes, or participate indirectly in demand response through an approved market participant or aggregator. A hotel may be a retail customer on paper, but its operating behavior still has wholesale-market consequences."
        - heading "Economic Opportunities" [level=3] [ref=e356]
        - paragraph [ref=e357]: Value accrues in layers. The opportunities below ascend from the broadest and lowest-risk — smarter procurement and reduced capacity exposure — through demand response and aggregation, up to the most capital-intensive layer, behind-the-meter assets. Each higher rung depends on the operational intelligence established beneath it, which is why the sequence matters as much as any single tactic.
        - list [ref=e358]:
          - listitem [ref=e359]:
            - generic [ref=e360]: "1"
            - generic [ref=e361]:
              - paragraph [ref=e362]: Procurement & Capacity Exposure
              - paragraph [ref=e363]:
                - text: FERC oversees PJM’s energy, capacity, and ancillary-service markets — understanding them opens opportunities to use energy in grid-wide low-demand hours and less during high demand.
                - link "[13]" [ref=e364] [cursor=pointer]:
                  - /url: "#src-13"
                - link "[14]" [ref=e365] [cursor=pointer]:
                  - /url: "#src-14"
                - text: Beyond monthly demand charges, a hotel’s contribution during a small number of system-wide peak hours can influence future capacity-related charges.
          - listitem [ref=e366]:
            - generic [ref=e367]: "2"
            - generic [ref=e368]:
              - paragraph [ref=e369]: Demand Response Participation
              - paragraph [ref=e370]: HVAC, domestic hot water, laundry, pool equipment, and ventilation schedules can often be adjusted for short periods without materially impacting the guest experience when professionally managed.
          - listitem [ref=e371]:
            - generic [ref=e372]: "3"
            - generic [ref=e373]:
              - paragraph [ref=e374]: Virtual Power Plants & DER Aggregation
              - paragraph [ref=e375]: Most individual hotels are too small to participate directly in wholesale markets. Aggregators combine hundreds or thousands of sites into a portfolio capable of meeting market participation requirements.
          - listitem [ref=e376]:
            - generic [ref=e377]: "4"
            - generic [ref=e378]:
              - paragraph [ref=e379]: Behind-the-Meter Asset Optimization
              - paragraph [ref=e380]: Battery storage, solar, CHP, and thermal storage are valuable not because they store electricity, but because they store it at one moment and deploy it at another — which is why operational intelligence must precede capital deployment.
        - heading "Retail Choice & Illinois Energy Policy" [level=3] [ref=e381]
        - paragraph [ref=e382]:
          - text: Illinois has retail electric choice in the major investor-owned utility territories, including ComEd, Ameren Illinois, and MidAmerican — customers can choose the electricity-supply portion of service while the local utility remains responsible for delivery, reliability, outage response, and metering.
          - link "[15]" [ref=e383] [cursor=pointer]:
            - /url: "#src-15"
          - text: The appropriate product depends on the property’s load and risk tolerance, not simply the lowest quoted cents-per-kWh rate.
          - link "[16]" [ref=e384] [cursor=pointer]:
            - /url: "#src-16"
          - text: Public Act 104-0458 establishes new Illinois policy work related to storage and customer-sited flexibility.
          - link "[29]" [ref=e385] [cursor=pointer]:
            - /url: "#src-29"
          - text: PJM states that its full DER energy and ancillary-services model is expected in February 2028 and capacity participation begins with the 2028/2029 BRA.
          - link "[12]" [ref=e386] [cursor=pointer]:
            - /url: "#src-12"
      - generic [ref=e387]:
        - generic [ref=e388]: "06"
        - heading "The Hotel Energy Intelligence Stack" [level=2] [ref=e391]
        - paragraph [ref=e392]:
          - text: Machine learning is useful when it improves a decision that already has economic value. For hotels, the useful decisions are load forecasting, block sizing, peak-risk alerts, controllable-load estimation, anomaly detection, demand response execution, and behind-the-meter dispatch — an established research area, and NREL’s Wattile project illustrates probabilistic building load forecasting using historical weather and occupancy indicator streams.
          - link "[17]" [ref=e393] [cursor=pointer]:
            - /url: "#src-17"
          - text: "The four layers below map directly onto the five-step sequence introduced earlier: Data and Intelligence are where the property measures and models; Control is where it acts; Market is where verified performance is monetized. Behind-the-meter assets come last, and only after the first four layers have established what the load is worth."
        - generic [ref=e394]:
          - generic [ref=e395]:
            - paragraph [ref=e399]: The Data Layer
            - list [ref=e400]:
              - listitem [ref=e401]: Revenue-grade interval meter data (15-minute or finer)
              - listitem [ref=e402]: Submetering for HVAC, hot water, laundry
              - listitem [ref=e403]: "BMS points: temperatures, setpoints, equipment status"
              - listitem [ref=e404]: "Occupancy & service proxies: PMS room count, bookings, events"
              - listitem [ref=e405]: "Market data: weather forecasts, PJM day-ahead & real-time prices"
          - generic [ref=e406]:
            - paragraph [ref=e410]: The Intelligence Layer
            - list [ref=e411]:
              - listitem [ref=e412]: Baseline modeling
              - listitem [ref=e413]: Probabilistic load forecasting
              - listitem [ref=e414]: Flexibility envelope modeling
              - listitem [ref=e415]: Anomaly detection
              - listitem [ref=e416]: Optimization
          - generic [ref=e417]:
            - paragraph [ref=e421]: The Control Layer
            - paragraph [ref=e422]:
              - text: "Deterministic execution at the edge; the model recommends, the building only runs pre-approved sequences. Hard guardrails, in order: life safety, guest comfort, equipment protection, cost optimization. OpenADR standardizes DR/DER communication, but local override & fail-safe logic are still required."
              - link "[18]" [ref=e423] [cursor=pointer]:
                - /url: "#src-18"
              - link "[19]" [ref=e424] [cursor=pointer]:
                - /url: "#src-19"
          - generic [ref=e425]:
            - paragraph [ref=e429]: The Market Layer
            - paragraph [ref=e430]:
              - text: Negotiate procurement around a better-understood load profile; reduce peak-risk exposure; participate in demand response through a partner; dispatch solar-storage against known marginal-value hours.
              - link "[20]" [ref=e431] [cursor=pointer]:
                - /url: "#src-20"
              - link "[21]" [ref=e432] [cursor=pointer]:
                - /url: "#src-21"
        - heading "Baselines" [level=3] [ref=e433]
        - paragraph [ref=e434]: The baseline is the foundation of the entire strategy. A useful baseline can’t rely only on last year’s bills or average monthly usage — it must use interval data, weather, occupancy proxies, and operational context to estimate what load would have been under comparable conditions. A 90%-occupancy day in July should not be compared directly to a 45%-occupancy day in April.
        - heading "HVAC & Hot Water Analysis" [level=3] [ref=e435]
        - paragraph [ref=e436]: HVAC and domestic hot water are priority end uses to measure because they are closely coupled to weather, occupancy, equipment schedules, and guest comfort. The useful first step is property-specific submetering and operating-context review; portfolio benchmarks can identify a question, but they do not determine the right control sequence for an individual hotel.
        - heading "Forecast Accuracy" [level=3] [ref=e437]
        - paragraph [ref=e438]: A model may show acceptable average error across the month but still fail during the highest-value hours, so it should measure peak-hour error and confidence-band performance — and know when operator review is required. Accuracy should improve as more interval, occupancy, weather, and event data accumulate.
      - generic [ref=e439]:
        - generic [ref=e440]: "07"
        - heading "Driving Immediate Savings" [level=2] [ref=e443]
        - heading "Electricity Procurement" [level=3] [ref=e444]
        - paragraph [ref=e445]: Procurement should begin with interval data, tariff review, contract terms, and a clearly stated risk tolerance. Fixed, indexed, and pass-through structures solve different problems; a rate quote alone does not show how a property will perform.
        - heading "ComEd BESH Hourly Pricing" [level=3] [ref=e446]
        - paragraph [ref=e447]:
          - text: ComEd’s Basic Electric Service–Hourly Pricing (BESH) is an hourly-priced supply option. The energy price varies with the hourly market price, so shifting use can help in some hours and expose a customer to higher costs in others. ComEd states that individual bills and savings vary with weather, market conditions, and usage; savings are not guaranteed.
          - link "[30]" [ref=e448] [cursor=pointer]:
            - /url: "#src-30"
          - link "[31]" [ref=e449] [cursor=pointer]:
            - /url: "#src-31"
          - text: The cold-weather evidence in
          - link "Appendix A6" [ref=e450] [cursor=pointer]:
            - /url: "#appendix-a6"
          - text: is regional context, not a modeled all-in bill or an enrollment recommendation.
        - heading "Bill Validation" [level=3] [ref=e451]
        - paragraph [ref=e452]: A concise bill-validation review reconciles interval data, billed demand, supply and delivery components, applicable riders, and supplier pass-throughs against the governing tariff and contract. It helps establish a trustworthy baseline before a pricing or control decision is made.
        - heading "Futures & Risk Management" [level=3] [ref=e453]
        - paragraph [ref=e454]:
          - text: Financial hedges can be used to manage defined exposures, but they introduce basis, volume, liquidity, credit, and governance risks. Nodal Exchange lists hourly power futures and options products; whether any product is appropriate depends on the property’s contractual exposure and qualified risk-management process.
          - link "[32]" [ref=e455] [cursor=pointer]:
            - /url: "#src-32"
      - generic [ref=e456]:
        - generic [ref=e457]: "08"
        - heading "BTM Generation & Storage" [level=2] [ref=e460]
        - paragraph [ref=e461]:
          - text: Behind-the-meter assets should be sized after the load is understood. Their financial value depends on when output or discharge coincides with avoided energy costs, demand charges, capacity exposure, DR events, tariff rules, interconnection limits, and emissions goals.
          - link "[17]" [ref=e462] [cursor=pointer]:
            - /url: "#src-17"
          - link "[21]" [ref=e463] [cursor=pointer]:
            - /url: "#src-21"
          - link "[25]" [ref=e464] [cursor=pointer]:
            - /url: "#src-25"
          - link "[27]" [ref=e465] [cursor=pointer]:
            - /url: "#src-27"
        - heading "Solar Considerations" [level=3] [ref=e466]
        - paragraph [ref=e467]:
          - text: Solar is not automatically a peak hedge. DOE’s discussion of the duck curve illustrates why production timing and net-load timing should be analyzed before a system is sized.
          - link "[26]" [ref=e468] [cursor=pointer]:
            - /url: "#src-26"
          - text: Interconnection, tariff treatment, and available credits must be confirmed for the specific project and jurisdiction.
        - heading "Storage Considerations" [level=3] [ref=e469]
        - paragraph [ref=e470]:
          - text: Battery value is primarily a timing problem. NREL research identifies demand charges as a key predictor of financial performance for behind-the-meter battery storage, and EIA explains that battery arbitrage means charging when prices are low and discharging when prices are high.
          - link "[25]" [ref=e471] [cursor=pointer]:
            - /url: "#src-25"
          - link "[27]" [ref=e472] [cursor=pointer]:
            - /url: "#src-27"
          - text: In hotels, the same asset may support peak management, DR performance, solar self-consumption, resilience planning, and tariff optimization — but those use cases must be stacked carefully. Given the unique load shapes of hotel properties
          - link "780" [ref=e473] [cursor=pointer]:
            - /url: "#prop-780"
          - link "781" [ref=e474] [cursor=pointer]:
            - /url: "#prop-781"
          - text: ", storage offers owners unusual flexibility in reducing demand charges while using headroom that sits unused much of the year."
        - heading "Recommended Sequencing" [level=3] [ref=e475]
        - list [ref=e476]:
          - listitem [ref=e477]:
            - generic [ref=e478]: "1"
            - generic [ref=e479]:
              - paragraph [ref=e480]: Measure
              - paragraph [ref=e481]: Create clean whole-building and major-end-use interval data.
          - listitem [ref=e482]:
            - generic [ref=e483]: "2"
            - generic [ref=e484]:
              - paragraph [ref=e485]: Model
              - paragraph [ref=e486]: Forecast load, estimate uncertainty, and identify marginal-value hours.
          - listitem [ref=e487]:
            - generic [ref=e488]: "3"
            - generic [ref=e489]:
              - paragraph [ref=e490]: Control
              - paragraph [ref=e491]: Test low-risk operating strategies with comfort and equipment guardrails.
          - listitem [ref=e492]:
            - generic [ref=e493]: "4"
            - generic [ref=e494]:
              - paragraph [ref=e495]: Monetize
              - paragraph [ref=e496]: Use performance records for procurement, peak-risk management, and DR participation.
          - listitem [ref=e497]:
            - generic [ref=e498]: "5"
            - generic [ref=e499]:
              - paragraph [ref=e500]: Build
              - paragraph [ref=e501]: Size storage and other strategies only after the first four steps establish the value stack.
        - heading "Considerations" [level=3] [ref=e502]
        - paragraph [ref=e503]:
          - text: Market rules, participation requirements, tariffs, and economics can change. Assets should therefore be evaluated first against value that can be verified under current conditions, with future DER participation treated as optional upside.
          - link "[12]" [ref=e504] [cursor=pointer]:
            - /url: "#src-12"
      - generic [ref=e505]:
        - generic [ref=e506]: "09"
        - heading "Conclusion" [level=2] [ref=e509]
        - paragraph [ref=e510]: "A hotel’s energy strategy should begin with the operating reality: energy supports a continuous guest experience, and its cost depends on timing as well as volume. The practical sequence is to measure, model, control, monetize, and then build. That sequence gives owners a defensible baseline, protects comfort and equipment, and makes future procurement or asset decisions easier to evaluate."
        - paragraph [ref=e511]: "The four illustrative meter profiles in this paper are regional evidence, not a universal forecast. They support a broader hospitality thesis: an owner who understands the property’s actual load, constraints, and bill structure is better equipped to reduce avoidable cost and assess future flexibility opportunities."

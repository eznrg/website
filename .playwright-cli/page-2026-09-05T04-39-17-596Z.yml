        - paragraph [ref=f3e258]: "This Chicago-North hotel improved materially from 2023 to 2025. However, the core finding with respect to energy is that utilities remained highly significant to profitability: in 2025, utilities still represented 21.7% of GOP. The stronger thesis is not simply that hotels should use less energy and “save more money” — it is that hotels need to know which loads are fixed, which are variable, which are weather-driven, which are schedulable, and which are controllable without affecting guest experience."

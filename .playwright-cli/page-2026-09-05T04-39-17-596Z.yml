              - paragraph [ref=f3e521]: Size storage and other strategies only after the first four steps establish the value stack.
        - heading "Considerations" [level=3] [ref=f3e522]
        - paragraph [ref=f3e523]: The evolution of electricity markets has never been instantaneous. Regulatory frameworks develop through a deliberate process involving utilities, regulators, grid operators, consumer advocates, market participants, and policymakers — and while that can slow implementation, the process exists to preserve reliability, ensure fair competition, and avoid unintended consequences. FERC Order 2222 was issued in September 2020, and regional market operators have begun implementing compliance frameworks, but full market participation for aggregated distributed energy resources remains a multi-year undertaking; in PJM, implementation continues in phases, with current timelines extending into 2028 for full functionality. We acknowledge the uncertainty in timing, market design, participation requirements, and the economic value ultimately available to our stakeholders.
        - blockquote [ref=f3e524]:
          - paragraph [ref=f3e525]: We don’t try to time the market. We become the market by serving our customers.
        - paragraph [ref=f3e526]: "We believe uncertainty should be acknowledged rather than ignored. As stewards of our stakeholders’ capital, we view regulatory developments as opportunities, not assumptions — so we proceed cautiously, focusing on strategies that generate measurable value under today’s market structure while maintaining optionality for future participation. Our business model does not depend on the successful implementation of any single regulatory initiative: the core economics come from improving energy procurement, reducing operating expenses, forecasting load more accurately, optimizing consumption patterns, and identifying operational inefficiencies — benefits that can be realized immediately, under existing market rules. Should Order 2222 and similar reforms unlock additional opportunities for distributed energy resources, demand flexibility, virtual power plants, or wholesale market participation, our platform is designed to capture them. If timelines shift or market structures evolve differently than anticipated, the underlying value proposition is unchanged: lower energy costs, reduced volatility, improved operational intelligence, and stronger asset performance. Regulatory change represents upside, not a prerequisite."

      - generic [ref=f3e113]:
        - generic [ref=f3e114]: "01"
        - heading "Executive Summary" [level=2] [ref=f3e117]
        - paragraph [ref=f3e118]: "A hotel is not an office building with beds. It is a 24/7 service factory where electricity, gas, and water are converted into sleep quality, hot showers, clean linens, food service, comfort, and brand consistency. That makes energy both a cost center and a product input. The goal is not simply to use less energy — it is to use the right energy, at the right time, in ways guests never notice, all in the effort to increase Net Operating Income (NOI). Because a hotel trades on its NOI, every dollar of energy cost removed raises not just profit but the property’s underlying asset value. EZ NRG is built to deliver that value on an aligned model: we own the enabling asset, the owner saves, with $0 down."
        - paragraph [ref=f3e119]: "In ComEd/PJM, the value of energy management is increasingly determined not only by annual kWh savings, but by when load occurs, how much flexibility exists, and whether performance can be verified. This white paper argues that machine learning should not be treated as a stand-alone product or an “AI layer.” Its practical role is to coordinate decisions that already have economic value: forecasting load, identifying peak-risk windows, estimating controllable flexibility, detecting waste, improving procurement decisions, and preparing hotels for future demand response, storage, and virtual-power-plant participation. Regulatory reform — including FERC Order 2222 and Illinois storage/VPP policy — creates upside, but the near-term business case rests on existing operational savings, better procurement, and management. The recommended strategy is staged in five steps:"
        - generic [ref=f3e120]:
          - generic [ref=f3e121]:
            - paragraph [ref=f3e125]: Measure
            - paragraph [ref=f3e126]: Normalize interval, weather & occupancy data
          - generic [ref=f3e127]:
            - paragraph [ref=f3e131]: Model
            - paragraph [ref=f3e132]: Forecast load & flag anomalies
          - generic [ref=f3e133]:
            - paragraph [ref=f3e137]: Control
            - paragraph [ref=f3e138]: Act within guardrails, comfort first
          - generic [ref=f3e139]:
            - paragraph [ref=f3e143]: Monetize
            - paragraph [ref=f3e144]: Procurement, peak & DR value
          - generic [ref=f3e145]:
            - paragraph [ref=f3e149]: Build
            - paragraph [ref=f3e150]: Size solar, storage & CHP last
        - heading "24/7 Buildings" [level=3] [ref=f3e151]
        - paragraph [ref=f3e152]:
          - text: Hotel energy use is materially influenced by occupancy, but not linearly determined by it. The highest-value forecasting variables are occupancy, weather, service intensity, equipment schedules, and operating constraints. As utility rates become more dynamic (Time-of-Use) and market access grows, this opens the door to a unique opportunity. DOE’s Better Buildings hospitality sector notes that hotels are among the higher energy and water consumers per square foot because they operate continuously, and EIA’s 2018 CBECS lodging data shows that lodging represented 3% of U.S. commercial buildings, 9% of fuels consumption, and 8% of fuels expenditures — while water heating and space heating alone accounted for almost 40% of energy usage.
          - link "[1]" [ref=f3e153] [cursor=pointer]:
            - /url: "#src-1"
          - link "[2]" [ref=f3e154] [cursor=pointer]:
            - /url: "#src-2"
        - heading "Bridging the Value Gap Through Expertise" [level=3] [ref=f3e155]
        - paragraph [ref=f3e156]: "Hotel owners are entering a period where energy value is increasingly determined by timing, flexibility, and verifiability rather than only annual kWh savings or supplier contract price. PJM capacity-market volatility has moved from an abstract wholesale issue into a retail procurement issue: the 2025/2026 Base Residual Auction produced a $14.7 billion total cost to load, the 2026/2027 BRA cleared at the $329.17/MW-day UCAP cap, and the 2027/2028 BRA cleared at the temporary $333.44/MW-day UCAP cap while procuring less capacity than the RTO Reliability Requirement. These outcomes don’t flow through identically to every hotel — exposure depends on supplier contract structure, utility treatment, hedging, and rate design — but they make the same point: load shape, peak contribution, and contract structure now matter more than they did in a low-capacity-price environment."
      - generic [ref=f3e157]:
        - generic [ref=f3e158]: "02"
        - heading "What We Do" [level=2] [ref=f3e161]
        - paragraph [ref=f3e162]: We help hotel owners lower electricity cost and reduce market exposure using procurement, bill analysis, interval-data intelligence, and operational peak management — without disrupting guest experience.
      - generic [ref=f3e163]:
        - generic [ref=f3e164]: "03"
        - heading "Why Hotels Are a Distinct Energy System" [level=2] [ref=f3e167]
        - heading "A hotel is a service platform, not a generic commercial building." [level=3] [ref=f3e168]
        - paragraph [ref=f3e169]:
          - text: "Unlike many commercial properties, a hotel does not simply consume energy to keep a space open during business hours — it converts energy into a continuous guest experience: conditioned rooms, hot water, clean linens, food service, lighting, ventilation, elevators, technology access, common-area comfort, and brand-required amenity availability. Energy is therefore not just a utility expense; it is an input into the hotel’s core product. DOE and ENERGY STAR hospitality resources identify operations and controls as key energy-management themes for lodging facilities."
          - link "[1]" [ref=f3e170] [cursor=pointer]:
            - /url: "#src-1"
          - link "[3]" [ref=f3e171] [cursor=pointer]:
            - /url: "#src-3"
          - text: "Hotels also carry a mix of fixed, variable, and schedulable loads: common-area lighting, ventilation, refrigeration, IT systems, pumps, elevators, and baseline HVAC are always present, while occupancy, weather, housekeeping, food service, laundry volume, and event schedules drive the rest. A limited-service roadside hotel, a full-service urban hotel, and a resort property may all be classified as “lodging,” but their energy profiles behave very differently."
        - heading "The key variables are occupancy, weather, and service intensity." [level=3] [ref=f3e172]
        - paragraph [ref=f3e173]:
          - text: Occupancy changes guest-room HVAC, plug load, domestic hot water, elevators, laundry volume, kitchen activity, and staffing. Weather changes heating and cooling demand, humidity-control requirements, and equipment efficiency. Service intensity changes the non-room load, especially in full-service properties with kitchens, banquet space, laundry, pools, or spas — hotel energy forecasting research has explicitly used occupancy rate and temperature as model inputs, and hotel cooling-energy research confirms the influence of meteorological conditions and guest counts.
          - link "[4]" [ref=f3e174] [cursor=pointer]:
            - /url: "#src-4"
          - link "[5]" [ref=f3e175] [cursor=pointer]:
            - /url: "#src-5"
          - text: "This is why hotel load should not be treated as simply proportional to occupancy: a hotel has a meaningful baseload, and two nights with the same room count can produce different energy outcomes depending on outdoor temperature, event activity, laundry timing, guest behavior, and operating schedules."
        - heading "This load profile creates an information problem." [level=3] [ref=f3e176]
        - paragraph [ref=f3e177]:
          - text: "A monthly bill shows how much energy was consumed, but not when the hotel created cost, when it had flexibility, or which subsystem caused the deviation. The required foundation is therefore high-resolution interval data, weather, occupancy proxies, and operational context — together, they let a hotel move from reactive bill review to predictive energy management. The question changes from “how much did we spend last month?” to “which hours are likely to create avoidable costs, which systems are driving that risk, and what can we safely do about it without compromising the guest experience?” This is also why an intelligence layer becomes more valuable across a portfolio: one hotel’s interval data can identify local waste and peak-risk patterns, but many similar hotels in the same region reveal stronger ones — how comparable properties respond to weather, how occupancy translates into load, and which interventions are most effective."
          - link "[6]" [ref=f3e178] [cursor=pointer]:
            - /url: "#src-6"
          - link "[7]" [ref=f3e179] [cursor=pointer]:
            - /url: "#src-7"
          - text: Hotels are not merely buildings to be benchmarked; they are operating systems with measurable demand, controllable flexibility, and repeatable patterns.
      - generic [ref=f3e180]:
        - generic [ref=f3e181]: "04"
        - heading "The Load Shape Is the Asset" [level=2] [ref=f3e184]
        - paragraph [ref=f3e185]: If a hotel’s energy strategy has a single foundation, it is the shape of its load — not the total kilowatt-hours it consumes, but when those kilowatts arrive. Across four metered lodging properties in the ComEd territory, that shape is strikingly consistent, and it points the same direction.
        - paragraph [ref=f3e186]:
          - text: Every one of the four meters set its annual peak in January, and every peak landed in a morning or evening ramp hour — 07:00 and 09:00 on one side of the day, 17:00 and 19:00 on the other
          - link "780" [ref=f3e187] [cursor=pointer]:
            - /url: "#prop-780"
          - link "781" [ref=f3e188] [cursor=pointer]:
            - /url: "#prop-781"
          - text: . None peaked on a summer afternoon. That single fact matters because PJM’s system and capacity peaks fall on hot summer afternoons
          - link "[8]" [ref=f3e189] [cursor=pointer]:
            - /url: "#src-8"
          - text: — the hotel’s load is inverted relative to the grid it buys from. When the grid is most stressed and capacity is most expensive, these properties run near their seasonal minimum; when they hit their own peaks, the wider grid is calm.
        - paragraph [ref=f3e190]:
          - text: The monthly record makes the inversion concrete. For the combined meters detailed in
          - link "Appendix A5" [ref=f3e191] [cursor=pointer]:
            - /url: "#appendix-a5"
          - text: ", billing-month peak demand runs 127 kW in January and 98 kW in December but collapses to 46–47 kW across June, July, and August — a winter peak more than 2.5× the summer one. Because delivery (demand) charges are set by each month’s highest kW interval, the property carries its heaviest demand-charge burden in winter, not summer."
        - generic [ref=f3e192]:
          - generic [ref=f3e193]:
            - paragraph [ref=f3e194]: Peak-to-Average Ratio
            - paragraph [ref=f3e198]: 5.1x
          - generic [ref=f3e199]:
            - paragraph [ref=f3e200]: Winter vs. Summer Peak
            - paragraph [ref=f3e204]: 2.5x+
          - generic [ref=f3e205]:
            - paragraph [ref=f3e206]: Jan vs. Jul Delivery Charge
            - paragraph [ref=f3e210]: $2,540 / $920
        - paragraph [ref=f3e211]:
          - text: Two consequences follow, and they run through the rest of this paper. First, the peaks are peaky — individual meters show peak-to-average ratios as high as 5× (a 101.62 kW peak against a 19.9 kW average)
          - link "780" [ref=f3e212] [cursor=pointer]:
            - /url: "#prop-780"
          - text: . A load that spikes far above its own baseline for a handful of ramp hours is, by definition, a load with a large controllable, schedulable slice — the raw material for demand-charge management, demand response, and storage dispatch. Second, because those spikes rarely coincide with the grid’s own peaks, the property is naturally well-positioned on the capacity and coincident-peak exposures that increasingly drive cost.
        - heading "This is what it means to call a hotel a grid asset rather than a passive ratepayer." [level=3] [ref=f3e213]
        - paragraph [ref=f3e214]: The load shape is not a liability to be minimized; it is an asset to be understood and then monetized — through procurement structured around the real profile, demand-charge reduction targeted at the winter ramp hours, and, eventually, storage sized to the specific hours that carry the cost.
      - generic [ref=f3e215]:
        - generic [ref=f3e216]: "05"
        - heading "Why Hotels Need to Adopt an Energy Strategy" [level=2] [ref=f3e219]
        - paragraph [ref=f3e220]: From 2023 to 2025, one Chicago-area property saw considerable operating improvements — but energy tells a more complicated story than the topline growth suggests.

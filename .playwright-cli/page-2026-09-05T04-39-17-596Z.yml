        - heading "Energy Cost Is an Asset-Value Lever, Not Just a Line Item" [level=3] [ref=f3e299]
        - paragraph [ref=f3e300]:
          - text: Because hotels trade as income-producing assets, these utility figures matter well beyond the income statement. Every recurring dollar removed from operating expense flows directly into Net Operating Income, and stabilized NOI capitalized at the prevailing market cap rate is a primary determinant of a hotel’s value.
          - link "[9]" [ref=f3e301] [cursor=pointer]:
            - /url: "#src-9"
          - link "[10]" [ref=f3e302] [cursor=pointer]:
            - /url: "#src-10"
          - text: "The arithmetic is direct: at an illustrative 8.0% cap rate, a $50,000 reduction in annual utility expense is not merely a $50,000 saving — it represents roughly $625,000 in incremental asset value ($50,000 ÷ 0.08). Energy strategy is not a cost-cutting exercise; it is a balance-sheet lever, and the payoff scales with the property’s valuation multiple."
        - blockquote [ref=f3e303]:
          - paragraph [ref=f3e304]: At EZ NRG, our strategy targets 90–100% reductions to a client’s electricity bill — without the owner taking out loans, and with $0 down. We own the asset. You save.
      - generic [ref=f3e305]:
        - generic [ref=f3e306]: "06"
        - 'heading "Market Context: Illinois, ComEd & PJM" [level=2] [ref=f3e309]'
        - heading "Market Structure" [level=3] [ref=f3e310]
        - paragraph [ref=f3e311]: Founded in 1927, PJM is the regional grid operator responsible for coordinating the movement of wholesale electricity across a large multi-state region that includes northern Illinois and the ComEd service territory. PJM doesn’t own power plants, local distribution wires, or customer meters — instead, it acts as the independent system operator and market administrator that balances electricity supply and demand in real time, manages transmission-grid reliability, and runs wholesale markets for energy, capacity, and ancillary services.
        - generic [ref=f3e312]:
          - generic [ref=f3e313]:
            - paragraph [ref=f3e317]: Power Plant
            - paragraph [ref=f3e318]: Generates electricity
          - generic [ref=f3e319]:
            - paragraph [ref=f3e323]: Transmission
            - paragraph [ref=f3e324]: PJM balances & moves it long-distance
          - generic [ref=f3e325]:
            - paragraph [ref=f3e329]: Distribution
            - paragraph [ref=f3e330]: ComEd delivers it locally
          - generic [ref=f3e331]:
            - paragraph [ref=f3e335]: End User
            - paragraph [ref=f3e336]: The hotel meters & pays
        - paragraph [ref=f3e337]:
          - text: Customers usually don’t interact directly with PJM, but PJM outcomes influence the cost structure that eventually flows through to suppliers, utilities, and end-use customers.
          - link "[11]" [ref=f3e338] [cursor=pointer]:
            - /url: "#src-11"
          - text: Its membership includes utility companies, wholesale suppliers, large industrial users, and a growing number of DER aggregators participating on behalf of energy users who couldn’t otherwise access PJM’s markets.
          - link "[12]" [ref=f3e339] [cursor=pointer]:
            - /url: "#src-12"
          - text: In Illinois, ComEd remains responsible for delivering electricity safely and reliably over the local distribution system — even when a customer chooses a third-party retail supplier, ComEd continues to provide delivery service, maintain local wires and infrastructure, and respond to outages.
        - heading "Why This Matters to a Hotel’s Bill" [level=3] [ref=f3e340]
        - paragraph [ref=f3e341]: "Energy cost is shaped by more than the supplier’s cents-per-kWh rate. A hotel’s bill can reflect delivery charges, supply charges, capacity-related costs, transmission-related costs, taxes, riders, and contract-specific pass-throughs. PJM doesn’t send the hotel a monthly retail bill, but its markets help determine the underlying wholesale costs that suppliers and utilities must manage — so a hotel’s physical load shape (when it uses electricity, how high its peaks run, how flexible it can be) affects its exposure to costs that originate upstream. When the system is tight, high-demand hours become especially important: a customer that can forecast, reduce, or shift load during those windows may reduce certain cost exposures, improve procurement outcomes, or participate indirectly in demand response through an approved market participant or aggregator. A hotel may be a retail customer on paper, but its operating behavior still has wholesale-market consequences."
        - heading "Economic Opportunities" [level=3] [ref=f3e342]
        - paragraph [ref=f3e343]: Value accrues in layers. The opportunities below ascend from the broadest and lowest-risk — smarter procurement and reduced capacity exposure — through demand response and aggregation, up to the most capital-intensive layer, behind-the-meter assets. Each higher rung depends on the operational intelligence established beneath it, which is why the sequence matters as much as any single tactic.
        - list [ref=f3e344]:
          - listitem [ref=f3e345]:
            - generic [ref=f3e346]: "1"
            - generic [ref=f3e347]:
              - paragraph [ref=f3e348]: Procurement & Capacity Exposure
              - paragraph [ref=f3e349]:
                - text: FERC oversees PJM’s energy, capacity, and ancillary-service markets — understanding them opens opportunities to use energy in grid-wide low-demand hours and less during high demand.
                - link "[13]" [ref=f3e350] [cursor=pointer]:
                  - /url: "#src-13"
                - link "[14]" [ref=f3e351] [cursor=pointer]:
                  - /url: "#src-14"
                - text: Beyond monthly demand charges, a hotel’s contribution during a small number of system-wide peak hours can influence future capacity-related charges.
          - listitem [ref=f3e352]:
            - generic [ref=f3e353]: "2"
            - generic [ref=f3e354]:
              - paragraph [ref=f3e355]: Demand Response Participation
              - paragraph [ref=f3e356]: HVAC, domestic hot water, laundry, pool equipment, and ventilation schedules can often be adjusted for short periods without materially impacting the guest experience when professionally managed.
          - listitem [ref=f3e357]:
            - generic [ref=f3e358]: "3"
            - generic [ref=f3e359]:
              - paragraph [ref=f3e360]: Virtual Power Plants & DER Aggregation
              - paragraph [ref=f3e361]: Most individual hotels are too small to participate directly in wholesale markets. Aggregators combine hundreds or thousands of sites into a portfolio capable of meeting market participation requirements.
          - listitem [ref=f3e362]:
            - generic [ref=f3e363]: "4"
            - generic [ref=f3e364]:
              - paragraph [ref=f3e365]: Behind-the-Meter Asset Optimization
              - paragraph [ref=f3e366]: Battery storage, solar, CHP, and thermal storage are valuable not because they store electricity, but because they store it at one moment and deploy it at another — which is why operational intelligence must precede capital deployment.
        - heading "Retail Choice & Illinois Energy Policy" [level=3] [ref=f3e367]
        - paragraph [ref=f3e368]:
          - text: Illinois has retail electric choice in the major investor-owned utility territories, including ComEd, Ameren Illinois, and MidAmerican — customers can choose who supplies the electricity-supply portion of their service while the local utility remains responsible for delivery, reliability, outage response, and metering.
          - link "[15]" [ref=f3e369] [cursor=pointer]:
            - /url: "#src-15"
          - text: "For hotel owners, retail choice should be viewed as a strategic procurement tool rather than a simple rate-shopping exercise: a fixed-price product provides budget certainty but can embed supplier risk premiums, while an indexed or pass-through product exposes the customer more directly to wholesale movement, capacity costs, or other non-energy components. The best product depends on the hotel’s actual operating profile, not only the lowest quoted cents-per-kWh rate."
          - link "[16]" [ref=f3e370] [cursor=pointer]:
            - /url: "#src-16"
          - text: The Clean and Reliable Grid Affordability Act (CRGA, Public Act 104-0458, 2025) creates a policy pathway for energy storage procurement, a Storage for All evaluation, and customer-sited flexibility programs — all directly relevant to hotel earnings. In PJM, DER aggregation for energy and ancillary services is scheduled for February 1, 2028, with capacity-market implementation tied to the 2028/2029 capacity year. A hotel platform that can already measure, forecast, verify, and safely control load will be better positioned as these markets become accessible.
      - generic [ref=f3e371]:
        - generic [ref=f3e372]: "07"
        - 'heading "Solution: The Hotel Energy Intelligence Stack" [level=2] [ref=f3e375]'
        - paragraph [ref=f3e376]:
          - text: Machine learning is useful when it improves a decision that already has economic value. For hotels, the useful decisions are load forecasting, block sizing, peak-risk alerts, controllable-load estimation, anomaly detection, demand response execution, and behind-the-meter dispatch — an established research area, and NREL’s Wattile project illustrates probabilistic building load forecasting using historical weather and occupancy indicator streams.
          - link "[17]" [ref=f3e377] [cursor=pointer]:
            - /url: "#src-17"
          - text: "The four layers below map directly onto the five-step sequence introduced earlier: Data and Intelligence are where the property measures and models; Control is where it acts; Market is where verified performance is monetized. Behind-the-meter assets come last, and only after the first four layers have established what the load is worth."
        - generic [ref=f3e378]:
          - generic [ref=f3e379]:
            - paragraph [ref=f3e383]: The Data Layer
            - list [ref=f3e384]:
              - listitem [ref=f3e385]: Revenue-grade interval meter data (15-minute or finer)
              - listitem [ref=f3e386]: Submetering for HVAC, hot water, laundry
              - listitem [ref=f3e387]: "BMS points: temperatures, setpoints, equipment status"
              - listitem [ref=f3e388]: "Occupancy & service proxies: PMS room count, bookings, events"
              - listitem [ref=f3e389]: "Market data: weather forecasts, PJM day-ahead & real-time prices"
          - generic [ref=f3e390]:
            - paragraph [ref=f3e394]: The Intelligence Layer
            - list [ref=f3e395]:
              - listitem [ref=f3e396]: Baseline modeling
              - listitem [ref=f3e397]: Probabilistic load forecasting
              - listitem [ref=f3e398]: Flexibility envelope modeling
              - listitem [ref=f3e399]: Anomaly detection
              - listitem [ref=f3e400]: Optimization
          - generic [ref=f3e401]:
            - paragraph [ref=f3e405]: The Control Layer
            - paragraph [ref=f3e406]:
              - text: "Deterministic execution at the edge; the model recommends, the building only runs pre-approved sequences. Hard guardrails, in order: life safety, guest comfort, equipment protection, cost optimization. OpenADR standardizes DR/DER communication, but local override & fail-safe logic are still required."
              - link "[18]" [ref=f3e407] [cursor=pointer]:
                - /url: "#src-18"
              - link "[19]" [ref=f3e408] [cursor=pointer]:
                - /url: "#src-19"
          - generic [ref=f3e409]:
            - paragraph [ref=f3e413]: The Market Layer
            - paragraph [ref=f3e414]:
              - text: Negotiate procurement around a better-understood load profile; reduce peak-risk exposure; participate in demand response through a partner; dispatch solar-storage against known marginal-value hours.
              - link "[20]" [ref=f3e415] [cursor=pointer]:
                - /url: "#src-20"
              - link "[21]" [ref=f3e416] [cursor=pointer]:
                - /url: "#src-21"
        - heading "Baselines" [level=3] [ref=f3e417]
        - paragraph [ref=f3e418]: The baseline is the foundation of the entire strategy. A useful baseline can’t rely only on last year’s bills or average monthly usage — it must use interval data, weather, occupancy proxies, and operational context to estimate what load would have been under comparable conditions. A 90%-occupancy day in July should not be compared directly to a 45%-occupancy day in April.
        - heading "Forecast Accuracy" [level=3] [ref=f3e419]
        - paragraph [ref=f3e420]: A model may show acceptable average error across the month but still fail during the highest-value hours, so it should measure peak-hour error and confidence-band performance — and know when operator review is required. Accuracy should improve as more interval, occupancy, weather, and event data accumulate.
      - generic [ref=f3e421]:
        - generic [ref=f3e422]: "08"
        - heading "Driving Immediate Savings" [level=2] [ref=f3e425]
        - heading "Electricity Procurement" [level=3] [ref=f3e426]
        - paragraph [ref=f3e427]: Retail electricity choice has been a contentious topic in states across the United States, with critics questioning its effectiveness — often due to the conflict of interest a broker has in serving their clients. EZ NRG aligns those interests in a verifiable, autonomous manner, so our incentive remains to serve you.
        - heading "Real-Time Pricing" [level=3] [ref=f3e428]
        - paragraph [ref=f3e429]:
          - text: "Electricity procurement deals with securing forward contracts for future usage. Pre-existing structures also combine a fixed procurement with a real-time balancing mechanism — complex and costly enough that they’re typically reserved for industrial-scale customers. But these structures would be especially beneficial to hospitality owners given the nature of their load shape: because hospitality load runs inverted relative to grid-wide usage — peaking during morning and evening ramp hours rather than summer afternoons"
          - link "780" [ref=f3e430] [cursor=pointer]:
            - /url: "#prop-780"
          - link "781" [ref=f3e431] [cursor=pointer]:
            - /url: "#prop-781"
          - text: — hospitality properties have a real opportunity to leverage this fact. By aggregating properties, EZ NRG can act as the aggregator, adding value to hospitality owners through futures hedging, options contracts, and more.
        - paragraph [ref=f3e432]: We analyzed over 25,000 days of data from hotel owners in the Chicagoland region and correlated their interval usage with ComEd real-time pricing data. We found their average price could have been $2.96 per kWh (before capacity and transmission fees) had an energy strategy partner helped them confidently enroll in the program. Real-time pricing does carry downsides — severe peaks during grid-stressed events and added billing complexity from settling interval data against real-time prices — but not leveraging the real-time market, or at least negotiating smarter procurement contracts, is money left on the table for property owners.
        - generic [ref=f3e434]:
          - paragraph [ref=f3e435]: Modeled Average Price
          - paragraph [ref=f3e439]: $2.96/kWh
        - paragraph [ref=f3e440]: Before capacity & transmission fees · 25,000+ property-days analyzed, Chicagoland region
      - generic [ref=f3e441]:
        - generic [ref=f3e442]: "09"
        - heading "Long-Term Economics" [level=2] [ref=f3e445]
        - heading "A Waterfall of Value Creation That Compounds" [level=3] [ref=f3e446]
        - paragraph [ref=f3e447]:
          - text: Because of our vision for a stakeholder-led, decentralized energy business model, the economic benefits for our clients compound over time with each partner and with growth. The initial phase is designed to reduce upfront owner risk by focusing first on data access, bill analysis, interval-load review, and low-risk operational recommendations before any capital deployment or market obligation.
          - link "[22]" [ref=f3e448] [cursor=pointer]:
            - /url: "#src-22"
          - link "[23]" [ref=f3e449] [cursor=pointer]:
            - /url: "#src-23"

        - heading "Potential Economic Benefits" [level=3] [ref=f3e453]
        - paragraph [ref=f3e454]: "The future is hard to predict, and the following is for illustrative purposes only. If a hotel owner were to install a 100 kW battery and offer it as a demand response product to PJM, at the most recent price of $333.44/MW-day, the gross contracted earnings would look like this:"
        - generic [ref=f3e455]:
          - generic [ref=f3e456]:
            - paragraph [ref=f3e457]: Daily Gross Capacity Revenue
            - paragraph [ref=f3e461]: $30.68
          - generic [ref=f3e462]:
            - paragraph [ref=f3e463]: Annual Gross Capacity Revenue
            - paragraph [ref=f3e467]: $11,196.92
          - generic [ref=f3e468]:
            - paragraph [ref=f3e469]: Demand Charge Reduction
            - paragraph [ref=f3e473]: $9,600/yr
        - paragraph [ref=f3e474]: Demand charge reduction assumes 40 kW shaved per month at $20/kW.
        - paragraph [ref=f3e475]: While these figures may not seem significant on their own, this roughly $20,000 per year could instead fund sales-agency spend for additional bookings — and it doesn’t account for other market revenues (ancillary, energy, arbitrage). As rates continue to rise, this becomes a real profit lever for increasing income and asset value.
      - generic [ref=f3e476]:
        - generic [ref=f3e477]: "10"
        - 'heading "Behind-the-Meter Generation & Storage: Sequence Matters" [level=2] [ref=f3e480]'
        - paragraph [ref=f3e481]:
          - text: Behind-the-meter assets should be sized after the load is understood. Their financial value depends on when output or discharge coincides with avoided energy costs, demand charges, capacity exposure, DR events, tariff rules, interconnection limits, and emissions goals.
          - link "[17]" [ref=f3e482] [cursor=pointer]:
            - /url: "#src-17"
          - link "[21]" [ref=f3e483] [cursor=pointer]:
            - /url: "#src-21"
          - link "[25]" [ref=f3e484] [cursor=pointer]:
            - /url: "#src-25"
          - link "[27]" [ref=f3e485] [cursor=pointer]:
            - /url: "#src-27"
        - heading "Solar Considerations" [level=3] [ref=f3e486]
        - paragraph [ref=f3e487]:
          - text: Solar is not automatically a peak hedge. DOE’s discussion of the duck curve explains that high solar production can reduce net load during the day while demand ramps in the evening after solar falls off — a reason to analyze timing before maximizing system size.
          - link "[26]" [ref=f3e488] [cursor=pointer]:
            - /url: "#src-26"
        - heading "Storage Considerations" [level=3] [ref=f3e489]
        - paragraph [ref=f3e490]:
          - text: Battery value is primarily a timing problem. NREL research identifies demand charges as a key predictor of financial performance for behind-the-meter battery storage, and EIA explains that battery arbitrage means charging when prices are low and discharging when prices are high.
          - link "[25]" [ref=f3e491] [cursor=pointer]:
            - /url: "#src-25"
          - link "[27]" [ref=f3e492] [cursor=pointer]:
            - /url: "#src-27"
          - text: In hotels, the same asset may support peak management, DR performance, solar self-consumption, resilience planning, and tariff optimization — but those use cases must be stacked carefully. Given the unique load shapes of hotel properties
          - link "780" [ref=f3e493] [cursor=pointer]:
            - /url: "#prop-780"
          - link "781" [ref=f3e494] [cursor=pointer]:
            - /url: "#prop-781"
          - text: ", storage offers owners unusual flexibility in reducing demand charges while using headroom that sits unused much of the year."
        - heading "Recommended Sequencing" [level=3] [ref=f3e495]
        - list [ref=f3e496]:
          - listitem [ref=f3e497]:
            - generic [ref=f3e498]: "1"
            - generic [ref=f3e499]:
              - paragraph [ref=f3e500]: Measure
              - paragraph [ref=f3e501]: Create clean whole-building and major-end-use interval data.
          - listitem [ref=f3e502]:
            - generic [ref=f3e503]: "2"
            - generic [ref=f3e504]:
              - paragraph [ref=f3e505]: Model
              - paragraph [ref=f3e506]: Forecast load, estimate uncertainty, and identify marginal-value hours.
          - listitem [ref=f3e507]:
            - generic [ref=f3e508]: "3"
            - generic [ref=f3e509]:
              - paragraph [ref=f3e510]: Control
              - paragraph [ref=f3e511]: Test low-risk operating strategies with comfort and equipment guardrails.
          - listitem [ref=f3e512]:
            - generic [ref=f3e513]: "4"
            - generic [ref=f3e514]:
              - paragraph [ref=f3e515]: Monetize
              - paragraph [ref=f3e516]: Use performance records for procurement, peak-risk management, and DR participation.
          - listitem [ref=f3e517]:
            - generic [ref=f3e518]: "5"
            - generic [ref=f3e519]:
